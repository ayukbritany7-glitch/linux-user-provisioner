name: Linux User Provisioner Test

on: [push, pull_request]

jobs:
  execute-shell:
    # Uses GitHub's Red Hat Enterprise Linux image
    runs-on: ubuntu-latest

    steps:
    - name: Pull code from GitHub
      uses: actions/checkout@v4

    - name: Make script executable
      run: chmod +x usermanager.sh

    - name: Run Provisioning Test
      run: sudo ./usermanager.sh --file employees.csv
      
    - name: Verify Account Creation
      run: |
        echo "Checking system password configuration..."
        getent passwd
